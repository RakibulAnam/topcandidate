<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOP CANDIDATE — Land the job. One job post at a time.</title>
  <meta name="description" content="Paste a job post. Get a tailored resume, cover letter, recruiter email, LinkedIn note, and bilingual interview prep — built for the Bangladeshi job market. Pay with bKash." />

  <!-- Favicons. The mark is a "TC" monogram in real Source Serif 4 outlines
       (paths, not <text> — so it needs no font at render time), brand-700 ink
       ground with a charcoal-50 "T" and an accent-400 "C". Regenerate from
       public/favicon.svg; `apple-touch-icon.png` is deliberately square and
       unrounded because iOS applies its own mask on top. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Brand fonts. Tailwind + global styles live in src/index.css (loaded by Vite). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Merriweather:wght@300;400;700&family=Hind+Siliguri:wght@300;400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap"
    rel="stylesheet">
</head>

<body class="bg-charcoal-50 text-brand-700">
  <noscript>
    <div style="max-width:560px;margin:10vh auto;padding:32px;border:1px solid #E5E2D8;border-radius:16px;font-family:'Instrument Sans',system-ui,sans-serif;color:#1A1812;">
      <h1 style="font-family:'Source Serif 4',Georgia,serif;margin:0 0 12px 0;">JavaScript required</h1>
      <p style="margin:0;color:#6B6759;">TOP CANDIDATE needs JavaScript to tailor your resume. Please enable it and reload the page.</p>
    </div>
  </noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
