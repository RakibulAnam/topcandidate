<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- seo:start — dev defaults only. `npm run build` replaces everything up to
       seo:end with per-locale tags + JSON-LD generated by src/prerender.tsx
       (source of truth: the `seo` + `landing` sections of the i18n dictionaries). -->
  <title>TOP CANDIDATE — AI CV &amp; Resume Maker for Bangladesh</title>
  <meta name="description" content="Make an ATS-friendly CV / resume tailored to any job post in Bangladesh — plus a cover letter, recruiter email, LinkedIn note and বাংলা interview prep. First resume free. Pay with bKash." />
  <!-- seo:end -->
  <meta name="theme-color" content="#FAFAF7" />
  <meta name="application-name" content="TOP CANDIDATE" />
  <meta name="apple-mobile-web-app-title" content="TOP CANDIDATE" />
  <meta name="geo.region" content="BD" />
  <meta name="geo.placename" content="Bangladesh" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- The built page ships a static snapshot of the landing page inside
       #tc-prerender (for crawlers + first paint; see src/prerender.tsx). Hide
       it before first paint whenever the app is about to render something
       else — a signed-in user (Supabase keeps the session under
       sb-<ref>-auth-token), any other path the SPA rewrite served this file
       for, or a visitor whose language differs from the snapshot's — so they
       never see a flash of the wrong screen. Mirrors LocaleContext's
       detection. -->
  <style>.tc-boot #tc-prerender{display:none}</style>
  <script>
    (function () {
      var d = document.documentElement;
      var snap = d.getAttribute('data-prerender');
      if (!snap) return;
      var hide = false;
      try {
        var p = location.pathname;
        var paths = snap === 'bn' ? ['/bn', '/bn/', '/bn.html'] : ['/', '/index.html'];
        if (paths.indexOf(p) < 0) hide = true;
        for (var i = 0; !hide && i < localStorage.length; i++) {
          if (/^sb-.+-auth-token$/.test(localStorage.key(i) || '')) hide = true;
        }
        if (!hide && snap === 'en') {
          var stored = localStorage.getItem('topcandidate.locale');
          var want = stored === 'en' || stored === 'bn' ? stored
            : ((navigator.language || '').toLowerCase().indexOf('bn') === 0 ? 'bn' : 'en');
          if (want !== 'en') hide = true;
        }
      } catch (e) { /* storage blocked — show the snapshot */ }
      if (hide) d.className += ' tc-boot';
    })();
  </script>

  <!-- Favicons. The brand mark (ink "C" arc + saffron "T" crossbar) on a
       rounded cream tile; public/favicon.svg is the master. The in-app mark
       is public/logo-mark.svg (transparent). `apple-touch-icon.png` is
       square and unrounded because iOS applies its own mask on top. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Brand fonts. Tailwind + global styles live in src/index.css (loaded by Vite). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Merriweather:wght@300;400;700&family=Hind+Siliguri:wght@300;400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap"
    rel="stylesheet">
</head>

<body class="bg-charcoal-50 text-brand-700">
  <noscript>
    <div style="max-width:560px;margin:10vh auto;padding:32px;border:1px solid #E5E2D8;border-radius:16px;font-family:'Instrument Sans',system-ui,sans-serif;color:#0F1B2D;">
      <p style="font-family:'Source Serif 4',Georgia,serif;font-size:24px;font-weight:600;margin:0 0 12px 0;">JavaScript required</p>
      <p style="margin:0;color:#6B6759;">TOP CANDIDATE needs JavaScript to tailor your resume. Please enable it and reload the page.</p>
    </div>
  </noscript>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
